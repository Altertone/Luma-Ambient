name: Validate

on:
  push:
    branches: [main, "maintenance/**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luma-ambient-built-theme
          path: theme.js
          if-no-files-found: error
      - run: npm test
      - run: git diff --exit-code -- theme.js
