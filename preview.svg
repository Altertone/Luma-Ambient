<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Luma Ambient preview</title>
  <desc id="desc">An illustrative dark Spotify-style layout with muted violet accents, compact navigation, album artwork, and a quiet playback bar.</desc>
  <rect width="960" height="540" fill="#141218"/>
  <rect x="0" y="0" width="210" height="486" fill="#17141c"/>
  <path d="M210 0v486" stroke="#ffffff" stroke-opacity=".08"/>
  <text x="28" y="42" fill="#f3edf7" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700">Luma Ambient</text>
  <g fill="#cac4d0" font-family="Inter,Arial,sans-serif" font-size="14">
    <text x="30" y="98">Home</text><text x="30" y="132">Search</text><text x="30" y="198">Your Library</text>
    <text x="30" y="240" opacity=".72">Made for you</text><text x="30" y="274" opacity=".72">Recently played</text><text x="30" y="308" opacity=".72">Liked Songs</text>
  </g>
  <circle cx="17" cy="93" r="3" fill="#d0bcff"/>
  <text x="248" y="62" fill="#f3edf7" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700">A little more room to listen.</text>
  <text x="248" y="90" fill="#cac4d0" font-family="Inter,Arial,sans-serif" font-size="13">Your music, without the extra noise.</text>
  <rect x="248" y="124" width="190" height="190" rx="14" fill="#30283b"/>
  <circle cx="343" cy="219" r="62" fill="#d0bcff" opacity=".18"/>
  <circle cx="343" cy="219" r="42" fill="#d0bcff" opacity=".5"/>
  <circle cx="343" cy="219" r="17" fill="#211f26"/>
  <g fill="#f3edf7" font-family="Inter,Arial,sans-serif">
    <text x="466" y="158" font-size="17" font-weight="600">Quiet hours</text>
    <text x="466" y="181" font-size="13" fill="#cac4d0">An easy place to settle in.</text>
  </g>
  <rect x="466" y="212" width="390" height="42" rx="10" fill="#211f26"/>
  <rect x="466" y="266" width="390" height="42" rx="10" fill="#211f26"/>
  <rect x="466" y="320" width="390" height="42" rx="10" fill="#211f26"/>
  <g fill="#f3edf7" font-family="Inter,Arial,sans-serif" font-size="13">
    <text x="484" y="238">A slower kind of morning</text><text x="484" y="292">Soft focus</text><text x="484" y="346">After the rain</text>
  </g>
  <rect x="0" y="486" width="960" height="54" fill="#1d1b20"/>
  <path d="M0 486h960" stroke="#ffffff" stroke-opacity=".1"/>
  <rect x="248" y="510" width="464" height="3" rx="2" fill="#49454f"/>
  <rect x="248" y="510" width="182" height="3" rx="2" fill="#d0bcff"/>
  <g fill="#f3edf7" font-family="Inter,Arial,sans-serif" font-size="12">
    <text x="28" y="516">Quiet hours</text><text x="104" y="516" fill="#cac4d0">·</text><text x="116" y="516" fill="#cac4d0">Luma Ambient</text>
  </g>
  <g fill="#d0bcff"><circle cx="480" cy="500" r="4"/><circle cx="458" cy="500" r="3"/><circle cx="502" cy="500" r="3"/></g>
</svg>
